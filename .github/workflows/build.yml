name: Build StealthBrowser APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Manual trigger button on GitHub

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.33

      - name: Setup Android SDK/NDK cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.buildozer
            ~/.android
          key: buildozer-android-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-android-

      - name: Build APK
        run: |
          buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: '0'

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: StealthBrowser-APK
          path: bin/*.apk
          retention-days: 30

      - name: Show APK info
        run: |
          echo "Build complete!"
          ls -lh bin/*.apk
